name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: write

jobs:
  verify:
    name: Build, test and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One-time lockfile refresh while audited transitive dependency overrides are introduced.
      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Persist refreshed lockfile on feature-branch pushes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh audited build dependencies"
            git push
          fi
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm run audit
      - name: Type-check and build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Install Chromium smoke-test runtime
        run: npm install --no-save --package-lock=false playwright@1.64.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node scripts/browser-smoke.mjs

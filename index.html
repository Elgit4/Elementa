<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172D42" />
    <link rel="apple-touch-icon" href="/brand-mark.png" />
    <meta name="description" content="Elementa: an interactive chemistry learning app for Ghanaian SHS students." />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Elementa</title>
    <script>
      try { var t = localStorage.getItem('elementa-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
